schema: spec-driven

context: |
  The gauntlet is a personal agent workflow packaged as a plugin: agents delta (slice), alpha (build),
  beta (review), gamma (progress page), epsilon (orchestrate), the skills intake and gauntlet-loop, a
  progress-page template, and a gauntlet MCP server for worktrees, locks, and loop state.
  The package must conform to Agent Plugins 1.0.0 (https://agent-plugins.org/specification) for its
  portable parts (skills, MCP) and also install as a Claude Code plugin and marketplace
  (private repo callmeradical/gauntlet). Agents are Claude Code-only (outside Agent Plugins v1).
  Runtime dependencies: Python 3 standard library and git only; must run on macOS and Linux.
  Agent definitions are written as task directives, never personified.
  Changes to the user's live setup (~/.claude, ~/.augy, ~/.agents) happen only while no loop is
  running, with a backup and a rollback.

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
